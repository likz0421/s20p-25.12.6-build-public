name: verify-image

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: 'Release tag (empty = latest)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools tar gzip

      - name: Download and inspect image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ github.event.inputs.TAG }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "TAG=$TAG"
          mkdir -p img && cd img
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*squashfs-sysupgrade.bin' --dir .
          tar xf *squashfs-sysupgrade.bin
          sudo unsquashfs -no-progress -d rootfs sysupgrade-*/root >/dev/null
          sudo chmod -R a+rX rootfs
          R=rootfs
          PK="$R/lib/apk/db/installed"

          FAIL=0
          ok()   { echo "PASS  $*"; }
          bad()  { echo "FAIL  $*"; FAIL=$((FAIL+1)); }
          have() { grep -qx "P:$1" "$PK" 2>/dev/null; }
          want_pkg()  { if have "$1"; then ok "package present: $1"; else bad "package missing: $1"; fi; }
          deny_pkg()  { if have "$1"; then bad "package must be absent: $1"; else ok "package absent: $1"; fi; }

          echo '=== identity ==='
          cat $R/etc/openwrt_release 2>/dev/null || bad "missing /etc/openwrt_release"
          REL=$(sed -n "s/^DISTRIB_RELEASE='\(.*\)'/\1/p" $R/etc/openwrt_release 2>/dev/null)
          VER=$(cat $R/etc/openwrt_version 2>/dev/null)
          [ "$REL" = "25.12.6" ] && ok "release is 25.12.6" || bad "release is '$REL', expected 25.12.6"
          case "$VER" in
            ""|*SNAPSHOT*) bad "version marker is '$VER' (snapshot or empty)" ;;
            *) ok "version marker: $VER" ;;
          esac

          echo '=== LAN IP ==='
          # The expected LAN IP is carried in the release body ("LAN: x.x.x.x"); only fall
          # back to the documented default when the body does not state one.
          EXPECT_IP=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null \
            | grep -oE 'LAN: [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          EXPECT_IP=${EXPECT_IP:-10.1.1.1}
          echo "expected LAN IP: $EXPECT_IP"
          if grep -Fq "$EXPECT_IP" $R/bin/config_generate 2>/dev/null; then
            ok "config_generate uses $EXPECT_IP"
          else
            bad "config_generate does not contain $EXPECT_IP"
          fi

          echo '=== WiFi defaults ==='
          MTW=$R/lib/wifi/mtwifi.uc
          if [ -f "$MTW" ]; then
            grep -n 'ssid\|hanzi\|key\|encryption' "$MTW" | head -12
          else
            echo "missing $MTW"
          fi
          if [ -f "$MTW" ] && grep -q 'ssid: "hanzi"' "$MTW" && grep -q '"key": "hanziwawa"' "$MTW"; then
            ok "mtwifi.uc defaults: hanzi / hanziwawa"
          else
            bad "mtwifi.uc defaults not applied"
          fi
          WF=$R/etc/uci-defaults/99-set-wifi-defaults
          if [ -f "$WF" ] && grep -q 'hanzi' "$WF" && grep -q 'hanziwawa' "$WF"; then
            ok "99-set-wifi-defaults present"
          else
            bad "99-set-wifi-defaults missing or wrong"
          fi

          echo '=== themes ==='
          [ -d $R/www/luci-static/argon ] && ok "argon static files (default)" || bad "argon static files missing"
          [ -d $R/www/luci-static/fluent ] && bad "fluent static files must be gone" || ok "fluent static files removed"
          [ -f $R/etc/uci-defaults/99-set-default-theme ] && ok "default-theme uci-defaults" || bad "default-theme uci-defaults missing"
          if grep -q "mediaurlbase.*argon" $R/etc/config/luci 2>/dev/null; then
            ok "default theme baked in /etc/config/luci: argon"
          elif grep -q 'THEME="argon"' $R/etc/uci-defaults/99-set-default-theme 2>/dev/null \
               && grep -q 'mediaurlbase="/luci-static/\$THEME"' $R/etc/uci-defaults/99-set-default-theme 2>/dev/null; then
            ok "default theme set by first-boot uci-defaults: argon"
          else
            bad "default theme is not argon"
          fi
          if grep -q "luci.themes.Argon='/luci-static/argon'" $R/etc/uci-defaults/99-set-default-theme 2>/dev/null; then
            ok "Argon registered as a luci theme"
          else
            bad "Argon theme not registered in uci-defaults"
          fi
          if grep -q "option lang 'zh_cn'" $R/etc/config/luci 2>/dev/null; then
            ok "default LuCI language: zh_cn"
          else
            bad "default LuCI language is not zh_cn"
          fi

          echo '=== package feeds ==='
          FEEDLIST=$R/etc/apk/repositories.d/distfeeds.list
          if [ -f "$FEEDLIST" ]; then
            if grep -q 'downloads.immortalwrt.org' "$FEEDLIST" && ! grep -q 'vsean\|/video/' "$FEEDLIST"; then
              ok "distfeeds uses official ImmortalWrt mirror without video feed"
            else
              bad "distfeeds is not the official mirror or still contains video"
              cat "$FEEDLIST"
            fi
          else
            bad "missing $FEEDLIST"
          fi
          [ -f $R/etc/uci-defaults/99-fix-distfeeds ] && ok "distfeeds reset uci-defaults" || bad "distfeeds reset uci-defaults missing"
          KEY=$R/etc/apk/keys/fantastic-packages-20241123170031.pem
          if [ -f "$KEY" ] && head -1 "$KEY" | grep -q 'BEGIN PUBLIC KEY'; then
            ok "fantastic-packages public key installed"
          else
            bad "fantastic-packages public key missing or invalid"
          fi
          CUSTOM_SCRIPT=$R/etc/uci-defaults/99-add-fantastic-feed
          if [ -f "$CUSTOM_SCRIPT" ] && grep -q 'fantastic-packages.github.io/releases/25.12' "$CUSTOM_SCRIPT"; then
            ok "fantastic-packages feed configured at first boot"
          else
            bad "fantastic-packages feed setup script missing"
          fi
          [ -f $R/etc/uci-defaults/99-add-fantastic-feed ] && ok "fantastic feed uci-defaults" || bad "fantastic feed uci-defaults missing"

          echo '=== Open-Box must be gone ==='
          for f in usr/sbin/openbox-install etc/init.d/openbox-autoinstall etc/uci-defaults/99-enable-openbox-autoinstall; do
            [ -f "$R/$f" ] && bad "openbox leftover: /$f" || ok "openbox absent: /$f"
          done

          echo '=== honk (Open-Box 的替代) ==='
          for f in usr/bin/honk-core etc/init.d/honk etc/config/honk etc/honk/config.dae; do
            [ -f "$R/$f" ] && ok "honk: /$f" || bad "honk: /$f missing"
          done
          [ -L "$R/usr/share/honk/geoip.dat" ] && ok "honk geoip.dat link" || bad "honk geoip.dat link missing"
          [ -L "$R/usr/share/honk/geosite.dat" ] && ok "honk geosite.dat link" || bad "honk geosite.dat link missing"
          if grep -q "option enabled '0'" $R/etc/config/honk 2>/dev/null; then
            ok "honk ships disabled; the user turns it on after adding nodes"
          else
            bad "honk must default to enabled=0"
          fi
          if grep -q "password_auth: true" $R/etc/honk/config.dae 2>/dev/null; then
            ok "honk native API keeps password auth"
          else
            bad "honk config.dae lost password_auth"
          fi

          echo '=== 网口指示灯控制 ==='
          for f in usr/sbin/ethled etc/config/ethled etc/init.d/ethled etc/hotplug.d/iface/20-ethled \
                   www/luci-static/resources/view/ethled/main.js \
                   usr/share/luci/menu.d/luci-app-ethled.json usr/share/rpcd/acl.d/luci-app-ethled.json; do
            [ -f "$R/$f" ] && ok "ethled: /$f" || bad "ethled: /$f missing"
          done
          if grep -q "option switch_lan '0'" $R/etc/config/ethled 2>/dev/null; then
            ok "MT7531 lan1-5 writes stay disabled by default"
          else
            bad "ethled must ship with switch_lan=0 (unverified switch LED bits)"
          fi
          [ -x "$R/etc/init.d/ethled" ] && ok "ethled init is executable" || bad "ethled init is not executable"

          echo '=== required packages ==='
          for p in luci-app-lucky lucky luci-app-quickfile quickfile \
                   luci-nginx luci-app-diskman luci-app-upnp miniupnpd-nftables \
                   kmod-sched-core kmod-sched-bpf kmod-xdp-sockets-diag kmod-veth mdio-tools \
                   kmod-nft-queue kmod-nfnetlink-queue \
                   honk luci-app-honk luci-lib-daeuniverse v2ray-geoip v2ray-geosite luci-app-ethled \
                   luci-theme-argon kmod-mt_wifi mtwifi-cfg-ucode luci-app-mtwifi-cfg luci-i18n-base-zh-cn luci-app-argon-config ttyd luci-app-ttyd; do
            want_pkg "$p"
          done

          echo '=== forbidden packages ==='
          for p in luci-app-oaf kmod-oaf appfilter luci-app-samba4 samba4-server luci-app-filemanager luci-app-filebrowser filebrowser \
                   dae luci-app-dae daed dae-geoip dae-geosite luci-app-usb-printer p910nd luci-app-modem \
                   luci-theme-fluent luci-i18n-fluent-zh-cn openbox-installer; do
            deny_pkg "$p"
          done

          echo '=== package versions ==='
          if grep -A1 '^P:lucky$' "$PK" 2>/dev/null | grep -q '^V:3.5.0'; then
            ok "Lucky core version 3.5.0"
          else
            bad "Lucky core is not 3.5.0"
          fi
          if grep -A1 '^P:luci-theme-argon$' "$PK" 2>/dev/null | grep -q '^V:3.1.3'; then
            ok "Argon theme version 3.1.3"
          else
            bad "Argon theme is not 3.1.3"
          fi
          if grep -A1 '^P:honk$' "$PK" 2>/dev/null | grep -q '^V:0.1.0_beta6'; then
            ok "honk version 0.1.0_beta6 (pinned upstream release)"
          else
            bad "honk is not 0.1.0_beta6"
          fi
          echo "themes present in /www/luci-static: $(ls $R/www/luci-static/ 2>/dev/null | tr '\n' ' ')"

          echo '=== package count ==='
          echo "installed APK packages: $(grep -c '^P:' "$PK" 2>/dev/null || echo 0)"

          echo
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::verify failed: $FAIL check(s) failed"
            exit 1
          fi
          echo "All checks passed."
