name: build-s20p-25.12.6

on:
  workflow_dispatch:
    inputs:
      LAN_IP:
        description: 'LAN IP address'
        required: true
        default: '10.1.1.1'
      DEFAULT_THEME:
        description: 'Default LuCI theme'
        required: true
        type: choice
        default: 'argon'
        options:
          - argon
          - fluent
      WIFI_COMBO:
        description: 'WiFi driver + firmware'
        required: true
        type: choice
        default: '7673-20260601'
        options:
          - '7673-20260601'
          - '7672-20240823'
      UPLOAD_RELEASE:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  REPO_COMMIT: 9f397975c7b47ce6986a6e39529d2f72fd5c729d
  CONFIG_FILE: configs/s20p.config
  TZ: Asia/Shanghai
  LAN_IP: ${{ github.event.inputs.LAN_IP }}
  DEFAULT_THEME: ${{ github.event.inputs.DEFAULT_THEME }}
  WIFI_COMBO: ${{ github.event.inputs.WIFI_COMBO }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout build repo
      uses: actions/checkout@v4

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -yqq update
        sudo -E apt-get -yqq install curl dos2unix python3-netifaces libfuse-dev zip dwarves
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -yqq clean
        sudo timedatectl set-timezone "$TZ"
        df -hT

    - name: Clone source
      run: |
        # The root filesystem is ~14 GB free after cleanup; a full OpenWrt build
        # with BTF needs more. Use the 70+ GB /mnt scratch disk when present.
        FREE_KB=$(df -Pk /mnt 2>/dev/null | awk 'NR==2 {print $4}')
        if [ -n "${FREE_KB:-}" ] && [ "$FREE_KB" -gt 41943040 ]; then
          BUILD_ROOT=/mnt/openwrt-build
          sudo mkdir -p "$BUILD_ROOT"
          sudo chown "$(id -u):$(id -g)" "$BUILD_ROOT"
        else
          BUILD_ROOT="$GITHUB_WORKSPACE/openwrt"
        fi
        echo "BUILD_ROOT=$BUILD_ROOT"
        df -hT "$(dirname "$BUILD_ROOT")"
        git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" "$BUILD_ROOT"
        ln -sfn "$BUILD_ROOT" "$GITHUB_WORKSPACE/openwrt"
        if git -C openwrt fetch --depth 1 origin "$REPO_COMMIT"; then
          git -C openwrt checkout --detach "$REPO_COMMIT"
        else
          echo "WARNING: pinned source commit is not fetchable; using branch HEAD"
        fi
        git -C openwrt log -1 --oneline
        grep -E 'LINUX_VERSION-6.12' openwrt/target/linux/generic/kernel-6.12

    - name: DIY part 1 (third-party packages)
      run: |
        chmod +x "$GITHUB_WORKSPACE/scripts/diy-part1.sh"
        "$GITHUB_WORKSPACE/scripts/diy-part1.sh"

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: DIY part 2 (S20P fixes and defaults)
      run: |
        chmod +x "$GITHUB_WORKSPACE/scripts/diy-part2.sh"
        "$GITHUB_WORKSPACE/scripts/diy-part2.sh"

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: Load and verify config
      run: |
        cd openwrt
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

        if [ "$WIFI_COMBO" = "7672-20240823" ]; then
          sed -i 's/^CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y/# CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673 is not set/' .config
          sed -i 's/^CONFIG_MTK_MT_WIFI_MT7986_20260601=y/# CONFIG_MTK_MT_WIFI_MT7986_20260601 is not set/' .config
          sed -i 's|^CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986=.*|CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7986="mt7986-fw-20240823"|' .config
          {
            echo 'CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7672=y'
            echo 'CONFIG_MTK_MT_WIFI_MT7986_20240823=y'
          } >> .config
        fi

        make defconfig

        grep -q '^CONFIG_TARGET_MULTI_PROFILE=y$' .config || {
          echo "ERROR: multi-profile is not enabled"
          exit 1
        }

        grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_clx_s20p=y$' .config || {
          echo "ERROR: clx_s20p device is not selected"
          exit 1
        }

        grep -q '^VERSION_NUMBER:=25.12.6$' include/version.mk || {
          echo "ERROR: firmware version pin is missing"
          exit 1
        }

        grep -q '^PKG_VERSION:=3.5.0$' package/lucky/lucky/Makefile || {
          echo "ERROR: Lucky core is not 3.5.0"
          exit 1
        }

        grep -q 'PKG_VERSION:=3.1.1' package/luci-theme-argon/Makefile || {
          echo "ERROR: Argon theme is not 3.1.1"
          exit 1
        }

        for gone in luci-app-oaf kmod-oaf appfilter; do
          if grep -q "^CONFIG_PACKAGE_${gone}=y$" .config; then
            echo "ERROR: OAF package ${gone} should have been removed"
            exit 1
          fi
        done

        grep -q 'ssid: "hanzi"' package/mtk/applications/mtwifi-cfg-ucode/files/lib/wifi/mtwifi.uc || {
          echo "ERROR: default WiFi SSID is missing"
          exit 1
        }

        grep -q '"key": "hanziwawa"' package/mtk/applications/mtwifi-cfg-ucode/files/lib/wifi/mtwifi.uc || {
          echo "ERROR: default WiFi key is missing"
          exit 1
        }

        grep -q '^CONFIG_LUCI_LANG_zh_Hans=y$' .config || {
          echo "ERROR: LuCI zh_Hans language support was dropped"
          exit 1
        }

        grep -q "option lang 'zh_cn'" feeds/luci/modules/luci-base/root/etc/config/luci || {
          echo "ERROR: default LuCI language is not zh_cn"
          exit 1
        }

        [ "$(grep -c 'realtek,led-link-select = <0x27 0x27 0x27>' target/linux/mediatek/dts-ext/mt7986a-clx-s20p.dts)" = "2" ] || {
          echo "ERROR: RTL8221B link-select is not 0x27 0x27 0x27 for both PHYs"
          exit 1
        }
        [ "$(grep -c 'realtek,led-act-select = <0x7>' target/linux/mediatek/dts-ext/mt7986a-clx-s20p.dts)" = "2" ] || {
          echo "ERROR: RTL8221B act-select is not 0x7 for both PHYs"
          exit 1
        }
        [ -f target/linux/mediatek/patches-6.12/734-net-phy-realtek-apply-led-config-on-rtl822xb.patch ] || {
          echo "ERROR: RTL8221B C45 LED kernel patch is missing"
          exit 1
        }
        grep -q 'rtl8221b_config_led(phydev)' target/linux/mediatek/patches-6.12/734-net-phy-realtek-apply-led-config-on-rtl822xb.patch || {
          echo "ERROR: RTL8221B C45 LED kernel patch is malformed"
          exit 1
        }

        [ -x package/base-files/files/etc/uci-defaults/99-fix-distfeeds ] || {
          echo "ERROR: package-feed reset script is missing"
          exit 1
        }

        [ -f package/base-files/files/etc/apk/keys/fantastic-packages-20241123170031.pem ] || {
          echo "ERROR: fantastic-packages public key is missing"
          exit 1
        }

        grep -q 'fantastic-packages.github.io/releases/25.12' package/base-files/files/etc/uci-defaults/99-add-fantastic-feed || {
          echo "ERROR: fantastic-packages feed setup is missing"
          exit 1
        }

        [ -x package/base-files/files/etc/uci-defaults/99-add-fantastic-feed ] || {
          echo "ERROR: fantastic feed uci-defaults is missing"
          exit 1
        }

        grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config || {
          echo "ERROR: initramfs is not enabled"
          exit 1
        }

        for sym in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_KERNEL_BPF_EVENTS; do
          if ! grep -q "^${sym}=y$" .config; then
            echo "ERROR: ${sym} is not enabled"
            exit 1
          fi
        done

        for sym in CONFIG_BPF_SYSCALL CONFIG_BPF_JIT; do
          if ! grep -q "^${sym}=y$" target/linux/generic/config-6.12; then
            echo "ERROR: ${sym} missing from generic kernel config"
            exit 1
          fi
        done

        for pkg in kmod-mt_wifi mtwifi-cfg-ucode luci-app-mtwifi-cfg luci-app-lucky lucky luci-theme-argon luci-app-argon-config luci-theme-fluent luci-app-firewall luci-app-package-manager luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn openbox-installer luci-app-upnp luci-app-quickfile quickfile luci-nginx ttyd luci-app-ttyd luci-i18n-ttyd-zh-cn luci-app-diskman kmod-sched-core kmod-sched-bpf kmod-xdp-sockets-diag kmod-veth mdio-tools; do
          if ! grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
            echo "ERROR: package ${pkg} was dropped by make defconfig"
            exit 1
          fi
        done

        grep -E 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_clx_s20p|CONFIG_VERSION_NUMBER|CONFIG_MTK_MT_WIFI_(DRIVER_VERSION|MT7986_202|FIRMWARE_PATH)' .config

    - name: Download sources
      run: |
        cd openwrt
        if [ -d /mnt/openwrt-build ]; then
          sudo mkdir -p /mnt/tmp && sudo chown "$(id -u):$(id -g)" /mnt/tmp
          export TMPDIR=/mnt/tmp
        fi
        make download -j"$(nproc)"
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      run: |
        cd openwrt
        if [ -d /mnt/openwrt-build ]; then
          sudo mkdir -p /mnt/tmp && sudo chown "$(id -u):$(id -g)" /mnt/tmp
          export TMPDIR=/mnt/tmp
        fi
        echo "$(nproc) threads"
        df -hT .
        make -j"$(nproc)" || make -j1 || make -j1 V=s
        df -hT .

    - name: Collect output
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        ls -lh
        echo "DATE=$(date +%Y.%m.%d-%H%M)" >> "$GITHUB_ENV"
        mkdir -p "$GITHUB_WORKSPACE/out"
        cp -v *clx_s20p* "$GITHUB_WORKSPACE/out/"
        cp -v config.buildinfo feeds.buildinfo profiles.json sha256sums "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
        cd "$GITHUB_WORKSPACE/out"
        rm -f sha256sums-s20p.txt
        sha256sum * > sha256sums-s20p.txt

        UBOOT_ROOT="$GITHUB_WORKSPACE/uboot-pack"
        UBOOT_DIR="$UBOOT_ROOT/S20P-25.12.6-uboot"
        rm -rf "$UBOOT_ROOT"
        mkdir -p "$UBOOT_DIR/firmware" "$UBOOT_DIR/bootloader"
        INITRAMFS=$(ls *clx_s20p*-initramfs-kernel.bin 2>/dev/null | head -n1 || true)
        SYSUPGRADE=$(ls *clx_s20p*-squashfs-sysupgrade.bin 2>/dev/null | head -n1 || true)
        [ -n "$INITRAMFS" ] || { echo "ERROR: initramfs image missing"; exit 1; }
        [ -n "$SYSUPGRADE" ] || { echo "ERROR: sysupgrade image missing"; exit 1; }
        cp -v "$INITRAMFS" "$UBOOT_DIR/firmware/"
        cp -v "$SYSUPGRADE" "$UBOOT_DIR/firmware/"
        cp -v *clx_s20p*.manifest "$UBOOT_DIR/firmware/" 2>/dev/null || true
        cp -v "$GITHUB_WORKSPACE/uboot-files/"*.bin "$UBOOT_DIR/bootloader/"
        cp -v "$GITHUB_WORKSPACE/uboot-files/README-uboot.txt" "$UBOOT_DIR/"
        cp -v "$GITHUB_WORKSPACE/uboot-files/lgs-说明.txt" "$UBOOT_DIR/"
        (cd "$UBOOT_DIR/firmware" && rm -f sha256sums.txt && sha256sum * > sha256sums.txt)
        (cd "$UBOOT_DIR/bootloader" && rm -f sha256sums.txt && sha256sum * > sha256sums.txt)
        (cd "$UBOOT_ROOT" && zip -r "$GITHUB_WORKSPACE/out/S20P-25.12.6-uboot.zip" S20P-25.12.6-uboot)
        cd "$GITHUB_WORKSPACE/out"
        sha256sum S20P-25.12.6-uboot.zip >> sha256sums-s20p.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: s20p-25.12.6-${{ github.run_number }}-${{ env.WIFI_COMBO }}
        path: out

    - name: Create release
      if: github.event.inputs.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: s20p-25.12.6-${{ env.DATE }}-${{ env.WIFI_COMBO }}
        name: S20P 25.12.6 ${{ env.WIFI_COMBO }}
        files: out/*
        body: |
          - Source: ${{ env.REPO_URL }} (branch ${{ env.REPO_BRANCH }}, commit ${{ env.REPO_COMMIT }})
          - Version: 25.12.6 (kernel 6.12.112; mac80211/backports 6.18.55)
          - Device: CLX/Super Gateway S20P (`clx_s20p`)
          - LAN: ${{ env.LAN_IP }}
          - Default theme: ${{ env.DEFAULT_THEME }}
          - WiFi: ${{ env.WIFI_COMBO }}
          - Default WiFi: SSID `hanzi`, WPA2-PSK password `hanziwawa`
          - Open-Box: official installer included; first boot downloads the proprietary arm64 package from the official GitHub Release (not bundled here). Panel: port 3036; LuCI fallback page installed by the official script.
          - UPnP/file: luci-app-upnp + miniupnpd-nftables, luci-app-quickfile + quickfile, luci-app-diskman; Samba/file sharing removed
          - LuCI extras: ttyd web terminal, Argon config app, zh_cn core translation
          - 2.5G LEDs: RTL8221B C45 LED path enabled via kernel patch; `led-link-select = <0x27 0x27 0x27>` (10/100/1000/2.5G on all LED pins), `led-act-select = <0x7>` (activity on all pins); `mdio-tools` included for live PHY register checks
          - OAF removed by user request (no `luci-app-oaf`/`kmod-oaf`/`appfilter`)
          - Third-party feed: fantastic-packages 25.12 (aarch64_cortex-a53) public key and repository are preconfigured (`/etc/apk/keys/`, first-boot `customfeeds.list`); this trusts packages signed by that key. Kmods from third-party feeds may not match this kernel — prefer userspace packages only.
          - eBPF: BTF/BPF_EVENTS/KPROBE_EVENTS enabled; kmod-sched-core, kmod-sched-bpf, kmod-xdp-sockets-diag and kmod-veth included for dae. dae/daed themselves are not bundled; install dae from the feed when needed.
          - Kernel: 6.12.112 (mac80211/backports 6.18.55)
          - U-Boot pack: S20P-25.12.6-uboot.zip (sysupgrade + initramfs + optional fip/GPT + README)
          - USB printer: not included
          - Packages: Lucky 3.5.0 XiaoJV + LuCI 3.0.0-r30, Argon 3.1.1, Fluent 1.0.9, ttyd, mtwifi-cfg
          - Upgrade: sysupgrade or U-Boot; do not keep the 24.10 config.
          - Important: do NOT run `apk upgrade` — kernel and kmods are built as one image, a full upgrade can break the system. Use `apk add <package>` for individual plugins; feeds already point to the official ImmortalWrt 25.12-SNAPSHOT repository.
